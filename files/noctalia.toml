[accessibility]
ui_scale = 1.20

[bar.default]
# Romanticized i3bar: bottom edge, flush and square, with room to breathe;
# workspaces on the left, colored status blocks on the right.
position = "bottom"
thickness = 36
scale = 1.0
font_scale = 1.25
font_family = "FantasqueSansM Nerd Font"
font_weight = "medium"
color = "#cdd6f4"
margin_edge = 0
margin_ends = 0
padding = 0
widget_spacing = 12
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 0
radius_bottom_right = 0
concave_edge_corners = false
shadow = false
capsule = false
capsule_radius = 0.0
# Widgets fill the bar's full height (Noctalia defaults to 76%).
capsule_thickness = 1.0
start = [ "i3_workspaces", "spacer_1", "active_window" ]
center = [ ]
end = [ "media", "network", "sep_1", "temp", "sep_2", "sysmon_2", "sep_3", "sysmon_3", "sep_4", "volume", "sep_5", "clock", "tray", "notifications", "session", "spacer_2" ]

[shell]
clipboard_image_action_command = "$HOME/.local/bin/swash-screenshot --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = false

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "$HOME/.local/bin/swash-screenshot --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty" ]

[plugins]
enabled = [ "zaid/i3bar" ]

# Status blocks in soft Catppuccin tones; stats tint toward rose (#f38ba8)
# as they rise, like i3status's good/bad colors. Stats keep their glyphs
# until Noctalia ships `custom_label` (newer than 5.1.0).
[widget.i3_workspaces]
type = "zaid/i3bar:workspaces"
# Noctalia 5.1 tints the entire plugin using this color on hover. Keep that
# tint transparent; the plugin draws explicit colors and per-button hovers.
color = "#00000000"

[widget.active_window]
display = "text_only"
interactive = false
color = "#a6adc8"

[widget.network]
color = "#a6e3a1"

[widget.temp]
type = "sysmon"
stat = "cpu_temp"
visualization = "none"
color = "#f9e2af"
highlight_color = "#f38ba8"

[widget.sysmon_2]
type = "sysmon"
stat = "gpu_temp"
visualization = "none"
color = "#fab387"
highlight_color = "#f38ba8"

[widget.sysmon_3]
type = "sysmon"
stat = "ram_used"
visualization = "none"
color = "#89dceb"
highlight_color = "#f38ba8"

[widget.volume]
color = "#cba6f7"
mute_color = "#f38ba8"

[widget.clock]
format = "{:%a %d %b  %H:%M}"
color = "#cdd6f4"

[widget.notifications]
color = "#b4befe"

[widget.session]
color = "#f38ba8"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.spacer_1]
type = "spacer"

[widget.spacer_2]
type = "spacer"
length = 10

[widget.sep_1]
type = "zaid/i3bar:separator"
interactive = false

[widget.sep_2]
type = "zaid/i3bar:separator"
interactive = false

[widget.sep_3]
type = "zaid/i3bar:separator"
interactive = false

[widget.sep_4]
type = "zaid/i3bar:separator"
interactive = false

[widget.sep_5]
type = "zaid/i3bar:separator"
interactive = false
