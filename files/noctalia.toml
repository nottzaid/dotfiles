[accessibility]
ui_scale = 1.20

[bar.default]
# i3bar look (i3/i3bar defaults): bottom edge, flush and square, monospace,
# white text; workspaces on the left, status on the right, nothing centered.
position = "bottom"
thickness = 20
scale = 1.0
font_family = "monospace"
color = "#ffffff"
margin_edge = 0
margin_ends = 0
padding = 0
widget_spacing = 8
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 0
radius_bottom_right = 0
concave_edge_corners = false
shadow = false
capsule = false
capsule_radius = 0.0
start = [ "i3_workspaces", "spacer_1", "active_window" ]
center = [ ]
end = [ "media", "network", "sep_1", "temp", "sep_2", "sysmon_2", "sep_3", "sysmon_3", "sep_4", "volume", "sep_5", "clock", "tray", "notifications", "session" ]

[shell]
clipboard_image_action_command = "$HOME/.local/bin/swash-screenshot --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = false

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "$HOME/.local/bin/swash-screenshot --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty" ]

[plugins]
enabled = [ "zaid/i3bar" ]

# i3status-style blocks: colored like i3status (good #00ff00 tinting toward
# bad #ff0000 as a value rises), separated by i3bar's 1px lines. Stats keep
# their glyphs until Noctalia ships `custom_label` (newer than 5.1.0).
[widget.i3_workspaces]
type = "zaid/i3bar:workspaces"

[widget.active_window]
display = "text_only"

[widget.network]
color = "#00ff00"

[widget.temp]
type = "sysmon"
stat = "cpu_temp"
visualization = "none"
color = "#00ff00"
highlight_color = "#ff0000"

[widget.sysmon_2]
type = "sysmon"
stat = "gpu_temp"
visualization = "none"
color = "#00ff00"
highlight_color = "#ff0000"

[widget.sysmon_3]
type = "sysmon"
stat = "ram_used"
visualization = "none"
color = "#00ff00"
highlight_color = "#ff0000"

[widget.volume]
mute_color = "#ff0000"

[widget.clock]
format = "{:%Y-%m-%d %H:%M:%S}"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.spacer_1]
type = "spacer"

[widget.sep_1]
type = "zaid/i3bar:separator"

[widget.sep_2]
type = "zaid/i3bar:separator"

[widget.sep_3]
type = "zaid/i3bar:separator"

[widget.sep_4]
type = "zaid/i3bar:separator"

[widget.sep_5]
type = "zaid/i3bar:separator"
