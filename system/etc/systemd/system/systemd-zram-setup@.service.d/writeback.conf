# A disk behind zram swap, for what sits untouched in it
# (system/libexec/zram-writeback). Best effort: without it, zram swap is set
# up as before.
[Unit]
WantsMountsFor=/var/lib

[Service]
ExecStartPre=-/usr/local/libexec/zram-writeback attach %i
ExecStopPost=-/usr/local/libexec/zram-writeback detach %i
