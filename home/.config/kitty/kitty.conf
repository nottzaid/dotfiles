# Kitty + zmx configuration: Ghostty-parity Ctrl+b keymap & minimal look,
# zmx per-pane persistence, and Kitty multi-split layout persistence.

# ------------------------------------------------------------------ Looks ----
# Matches Ghostty's default colors, font sizing, minimal padding, and tabs.css
# (swap back to `include themes/noctalia.conf` anytime if you want Noctalia colors).

font_family                 Noto Sans Mono
font_size                   12.0

background                  #282c34
foreground                  #ffffff
cursor                      #ffffff
cursor_text_color           #282c34
selection_foreground        none
selection_background        none

color0                      #1d1f21
color1                      #cc6666
color2                      #b5bd68
color3                      #f0c674
color4                      #81a2be
color5                      #b294bb
color6                      #8abeb7
color7                      #c5c8c6
color8                      #666666
color9                      #d54e53
color10                     #b9ca4a
color11                     #e7c547
color12                     #7aa6da
color13                     #c397d8
color14                     #70c0b1
color15                     #eaeaea

hide_window_decorations     yes
window_padding_width        2
window_border_width         1px
draw_minimal_borders        yes
active_border_color         #4b5263
inactive_border_color       #1e222a
cursor_trail                0
confirm_os_window_close     0

# Slim text-only top tab strip matching Ghostty's tabs.css
tab_bar_edge                top
tab_bar_align               left
tab_bar_min_tabs            2
tab_bar_margin_height       4 2
tab_bar_style               separator
tab_separator               "  "
tab_title_template          " {title} "
tab_bar_background          #282c34
active_tab_background       #282c34
inactive_tab_background     #282c34
active_tab_foreground       #ffffff
inactive_tab_foreground     #7e828a
active_tab_font_style       normal

# ------------------------------------------------------- Shell & Watcher -----
shell                       /home/zaid/.config/kitty/zmx-shell
watcher                     /home/zaid/.config/kitty/zmx_watcher.py
enabled_layouts             splits,stack
notify_on_cmd_finish        unfocused 5.0 notify

# ------------------------------------------------------------- Keybindings ---
# Prefix ctrl+b: press ctrl+b, release, then press the action key.
map ctrl+b>ctrl+b           send_text all \x02
map ctrl+b>escape           discard_event

# Splits (panes)
map ctrl+b>h                neighboring_window left
map ctrl+b>j                neighboring_window down
map ctrl+b>k                neighboring_window up
map ctrl+b>l                neighboring_window right
map ctrl+b>tab              next_window
map ctrl+b>shift+tab        previous_window

map ctrl+b>v                launch --location=vsplit --cwd=current
map ctrl+b>minus            launch --location=hsplit --cwd=current
map ctrl+b>a                launch --location=split --cwd=current
map ctrl+b>z                toggle_layout stack
map ctrl+b>equal            reset_window_sizes
map ctrl+b>x                close_window
map ctrl+b>shift+p          set_window_title

# Tabs & sessions
map ctrl+b>c                new_tab_with_cwd
map ctrl+b>n                next_tab
map ctrl+b>p                previous_tab
map ctrl+b>1                goto_tab 1
map ctrl+b>2                goto_tab 2
map ctrl+b>3                goto_tab 3
map ctrl+b>4                goto_tab 4
map ctrl+b>5                goto_tab 5
map ctrl+b>6                goto_tab 6
map ctrl+b>7                goto_tab 7
map ctrl+b>8                goto_tab 8
map ctrl+b>9                goto_tab 9
map ctrl+b>comma            move_tab_backward
map ctrl+b>period           move_tab_forward
map ctrl+b>shift+t          set_tab_title
map ctrl+b>shift+x          close_tab
map ctrl+b>shift+o          close_other_tabs_in_os_window
map ctrl+b>shift+w          detach_tab
map ctrl+b>g                select_tab
map ctrl+b>q                close_os_window

# Named project sessions (save/switch multi-split layouts)
map ctrl+b>w                goto_session ~/.local/share/kitty/sessions
map ctrl+b>shift+s          save_as_session --save-only --base-dir ~/.local/share/kitty/sessions

# Tools
map ctrl+b>u                open_url_with_hints
map ctrl+b>e                show_scrollback
map ctrl+b>slash            search_scrollback
map ctrl+b>shift+slash      command_palette
map ctrl+b>s                edit_config_file
map ctrl+b>shift+r          load_config_file
map ctrl+b>i                debug_config
map ctrl+b>ctrl+r           clear_terminal reset active

# Direct Ghostty-style tab jumps
map alt+1                   goto_tab 1
map alt+2                   goto_tab 2
map alt+3                   goto_tab 3
map alt+4                   goto_tab 4
map alt+5                   goto_tab 5
map alt+6                   goto_tab 6
map alt+7                   goto_tab 7
map alt+8                   goto_tab 8
map alt+9                   goto_tab -1

# Sticky Resize mode (Esc / Enter / q to exit)
map --new-mode resize ctrl+b>r
map --mode resize h         resize_window narrower 2
map --mode resize j         resize_window shorter 2
map --mode resize k         resize_window taller 2
map --mode resize l         resize_window wider 2
map --mode resize shift+h   resize_window narrower 8
map --mode resize shift+j   resize_window shorter 8
map --mode resize shift+k   resize_window taller 8
map --mode resize shift+l   resize_window wider 8
map --mode resize left      resize_window narrower 2
map --mode resize down      resize_window shorter 2
map --mode resize up        resize_window taller 2
map --mode resize right     resize_window wider 2
map --mode resize equal     reset_window_sizes
map --mode resize escape    pop_keyboard_mode
map --mode resize enter     pop_keyboard_mode
map --mode resize q         pop_keyboard_mode

# Sticky Scroll / Copy mode (Esc / q to exit)
map --new-mode copy ctrl+b>[
map --mode copy j           scroll_line_down
map --mode copy k           scroll_line_up
map --mode copy down        scroll_line_down
map --mode copy up          scroll_line_up
map --mode copy ctrl+d      scroll_page_down
map --mode copy ctrl+u      scroll_page_up
map --mode copy ctrl+f      scroll_page_down
map --mode copy ctrl+b      scroll_page_up
map --mode copy page_down   scroll_page_down
map --mode copy page_up     scroll_page_up
map --mode copy g           scroll_home
map --mode copy shift+g     scroll_end
map --mode copy [           scroll_to_prompt -1
map --mode copy ]           scroll_to_prompt 1
map --mode copy slash       combine : pop_keyboard_mode : search_scrollback
map --mode copy e           combine : pop_keyboard_mode : show_scrollback
map --mode copy y           combine : copy_to_clipboard : pop_keyboard_mode
map --mode copy enter       combine : copy_to_clipboard : pop_keyboard_mode
map --mode copy q           pop_keyboard_mode
map --mode copy escape      pop_keyboard_mode
